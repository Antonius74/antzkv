name: CI

on:
  push:
    branches: [ main, cluster ]
  pull_request:
    branches: [ main, cluster ]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential libedit-dev libreadline-dev

    - name: Build project
      run: make clean && make

    - name: Run functional tests
      run: bash test/run_test.sh

    - name: Run cluster tests
      run: |
        # Kill any lingering servers
        pkill -9 -f antzkv-server || true
        sleep 1
        timeout 60 bash test/run_cluster_test.sh || true
      timeout-minutes: 2
      continue-on-error: true
